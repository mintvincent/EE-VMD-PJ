<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISTER × QIBAO — 하의 비교 분석</title>
<style>
:root{
  --bg:#f0f0f2;--sur:#fff;--card:#fff;--card2:#fafafa;--bdr:#e4e4e7;--bdr2:#ebebed;
  --txt:#18181b;--mu:#71717a;--mu2:#a1a1aa;
  --B:#b8832a;--C:#2a8a4a;--Bd:#fdf4e7;--Cd:#edf7f0;
  --danger:#ef4444;--info:#3b82f6;--ok:#10b981;--warn:#f59e0b;
  --ht-top:#ef4444;--ht-mid:#f97316;--ht-low:#f59e0b;--ht-dead:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;}

/* NAV */
.nav{display:flex;align-items:center;padding:0 24px;height:48px;background:var(--sur);border-bottom:1px solid var(--bdr);gap:16px;flex-shrink:0;}
.nav-brand{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--mu);}
.nav-links{display:flex;gap:6px;margin-left:auto;}
.nl{color:var(--mu);text-decoration:none;font-size:11px;padding:5px 12px;border:1px solid var(--bdr);border-radius:4px;}
.nl:hover{color:var(--B);border-color:var(--B);}
.nl.cur{color:var(--B);border-color:var(--B);}
.data-status{font-size:10px;color:var(--mu);margin-left:12px;}
.data-status.ok{color:var(--ok);}

/* TABS */
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 24px;gap:2px;flex-shrink:0;}
.tab{padding:0 20px;height:44px;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer;letter-spacing:.3px;}
.tab:hover{color:var(--txt);}
.tab.on{color:var(--B);border-bottom-color:var(--B);}

/* LAYOUT */
.pg{display:none;flex:1;overflow-y:auto;padding:24px;}
.pg.on{display:block;}
.section{margin-bottom:28px;}
.sec-title{font-size:10px;letter-spacing:2px;color:var(--mu);border-bottom:1px solid var(--bdr);padding-bottom:8px;margin-bottom:16px;text-transform:uppercase;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card2{background:var(--card2);border:1px solid var(--bdr2);border-radius:6px;padding:14px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.kpi-card{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:16px 18px;}
.kpi-label{font-size:10px;letter-spacing:1px;color:var(--mu);margin-bottom:10px;}
.kpi-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.kpi-brand{font-size:10px;}
.kpi-val{font-size:15px;font-weight:700;}
.kpi-bar-wrap{height:3px;background:#e4e4e7;border-radius:2px;margin-top:2px;margin-bottom:8px;}
.kpi-bar{height:3px;border-radius:2px;transition:width .6s ease;}

/* COMPARE TABLE */
.cmp-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.cmp-tbl th{padding:8px 12px;text-align:left;font-size:10px;letter-spacing:1px;color:var(--mu);border-bottom:1px solid var(--bdr);font-weight:500;white-space:nowrap;}
.cmp-tbl td{padding:9px 12px;border-bottom:1px solid #f4f4f5;vertical-align:middle;}
.cmp-tbl tr:last-child td{border-bottom:none;}
.cmp-tbl tr:hover td{background:#f4f4f5;}
.cmp-tbl td.lbl{color:var(--mu);font-size:11px;}
.cmp-tbl td.vB{color:var(--B);font-weight:700;}
.cmp-tbl td.vC{color:var(--C);font-weight:600;}
.cmp-tbl td.win-b{background:#fdf4e7;}
.cmp-tbl td.win-c{background:#edf7f0;}
.gap-tag{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;}
.gap-b{background:var(--Bd);color:var(--B);border:1px solid #e8c97a;}
.gap-c{background:var(--Cd);color:var(--C);border:1px solid #a8d8b8;}
.gap-n{background:#f4f4f5;color:var(--mu);border:1px solid var(--bdr);}

/* BOTTOM BAR CHART */
.btm-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;}
.btm-bar-label{width:72px;color:var(--mu);text-align:right;flex-shrink:0;}
.btm-bar-wrap{flex:1;height:16px;background:#e4e4e7;border-radius:3px;position:relative;overflow:hidden;}
.btm-bar-fill{height:100%;border-radius:3px;transition:width .6s ease;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.btm-bar-val{font-size:10px;color:var(--mu);width:80px;text-align:right;flex-shrink:0;}

/* ITEM TABLE */
.item-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.item-tbl th{padding:6px 10px;text-align:left;font-size:10px;color:var(--mu);border-bottom:1px solid var(--bdr);font-weight:500;white-space:nowrap;}
.item-tbl td{padding:7px 10px;border-bottom:1px solid #f4f4f5;vertical-align:middle;}
.item-tbl tr:last-child td{border-bottom:none;}
.item-tbl tr:hover td{background:#f4f4f5;}
.rb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;background:#e4e4e7;color:var(--mu);}
.rb.r1{background:#c8a96e22;color:var(--B);}
.rb.r2{background:#88888822;color:#aaa;}
.rb.r3{background:#88552222;color:#c08060;}
.tag{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600;}
.tag-b{background:var(--Bd);color:var(--B);border:1px solid #e8c97a;}
.tag-c{background:var(--Cd);color:var(--C);border:1px solid #a8d8b8;}

/* INSIGHT BOX */
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.insight-box{background:var(--card);border-radius:6px;padding:16px;border-left:3px solid var(--bdr);}
.insight-box.ib{border-left-color:var(--B);}
.insight-box.ic{border-left-color:var(--C);}
.insight-box.ix{border-left-color:var(--info);grid-column:span 2;}
.insight-lbl{font-size:10px;letter-spacing:1px;color:var(--mu);margin-bottom:8px;}
.insight-txt{font-size:11px;line-height:1.9;color:var(--txt);}

/* SCORE */
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.score-card{background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.score-name{font-size:10px;color:var(--mu);margin-bottom:10px;letter-spacing:.5px;}
.sbar-row{display:flex;align-items:center;gap:8px;font-size:10px;margin-bottom:5px;}
.sbar-lbl{width:14px;font-weight:700;}
.sbar-bg{flex:1;height:5px;background:#e4e4e7;border-radius:3px;}
.sbar-fill{height:5px;border-radius:3px;}
.sbar-num{width:28px;text-align:right;font-weight:600;}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--mu2);}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.3;}
.empty-txt{font-size:12px;line-height:1.8;}

/* RANK BADGE */
.rank-diff{font-size:10px;}
.rank-diff.up{color:var(--ok);}
.rank-diff.dn{color:var(--danger);}
.rank-diff.eq{color:var(--mu);}

/* MINI STAT */
.mini-stat{display:flex;flex-direction:column;gap:2px;}
.ms-val{font-size:18px;font-weight:800;line-height:1.2;}
.ms-sub{font-size:10px;color:var(--mu);}

/* OVERLAP INDICATOR */
.overlap-bar{display:flex;height:20px;border-radius:4px;overflow:hidden;margin:8px 0;}
.ob-b{background:var(--B);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;}
.ob-both{background:#666;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.ob-c{background:var(--C);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;}
</style>
</head>

<script>
// ═══ SM MAP ═══
const SM={
  AB:{c:'액세서리',i:'皮带',k:'벨트'},AC:{c:'액세서리',i:'ACC',k:'액세서리'},
  AG:{c:'액세서리',i:'ACC',k:'액세서리'},AK:{c:'액세서리',i:'包',k:'가방'},
  AM:{c:'액세서리',i:'ACC',k:'액세서리'},AN:{c:'액세서리',i:'ACC',k:'액세서리'},
  AP:{c:'액세서리',i:'配饰',k:'장식'},AS:{c:'액세서리',i:'丝巾',k:'스카프'},
  AU:{c:'액세서리',i:'ACC',k:'액세서리'},AW:{c:'액세서리',i:'ACC',k:'액세서리'},
  AY:{c:'액세서리',i:'ACC',k:'액세서리'},BW:{c:'상의',i:'衬衫',k:'셔츠'},
  CF:{c:'액세서리',i:'ACC',k:'액세서리'},CK:{c:'상의',i:'针织开衫',k:'가디건'},
  HW:{c:'상의',i:'POLO T',k:'폴로티'},JA:{c:'상의',i:'轻薄夹克',k:'경량재킷'},
  JH:{c:'상의',i:'牛仔外套',k:'데님재킷'},JJ:{c:'상의',i:'牛仔夹克',k:'데님재킷'},
  JK:{c:'상의',i:'西装夹克',k:'수트재킷'},JL:{c:'상의',i:'牛仔外套',k:'데님재킷'},
  JP:{c:'상의',i:'羽绒服',k:'패딩'},JT:{c:'상의',i:'牛仔外套',k:'데님재킷'},
  JW:{c:'상의',i:'—',k:'재킷'},KW:{c:'상의',i:'针织短袖',k:'니트반팔'},
  LA:{c:'상의',i:'吊带',k:'나시'},LS:{c:'액세서리',i:'针织ACC',k:'니트ACC'},
  MT:{c:'상의',i:'—',k:'티셔츠'},MZ:{c:'액세서리',i:'针织配饰',k:'니트잡화'},
  OJ:{c:'원피스',i:'牛仔连衣裙',k:'데님원피스'},OK:{c:'상의',i:'针织衫',k:'니트'},
  OM:{c:'원피스',i:'连衣裙',k:'원피스'},OW:{c:'원피스',i:'短袖连衣裙',k:'반팔원피스'},
  RA:{c:'상의',i:'短袖T',k:'반팔티'},RN:{c:'상의',i:'背心',k:'민소매'},
  RS:{c:'상의',i:'短袖T',k:'반팔티'},SK:{c:'상의',i:'针织衫',k:'니트'},
  TA:{c:'하의',i:'亚麻阔腿裤',k:'린넨와이드팬츠'},TC:{c:'하의',i:'棉裤',k:'면바지'},
  TH:{c:'하의',i:'短裤',k:'반바지'},TJ:{c:'하의',i:'牛仔裤',k:'데님팬츠'},
  TK:{c:'액세서리',i:'帽子',k:'모자'},TM:{c:'하의',i:'长裤',k:'긴바지'},
  VJ:{c:'상의',i:'牛仔',k:'데님'},VK:{c:'상의',i:'针织背心',k:'니트조끼'},
  VW:{c:'상의',i:'马甲',k:'조끼'},WH:{c:'하의',i:'半裙',k:'스커트'},
  WJ:{c:'하의',i:'牛仔半裙',k:'데님스커트'},YA:{c:'상의',i:'短袖衬衫',k:'반팔셔츠'},
  YC:{c:'상의',i:'衬衫',k:'셔츠'},YJ:{c:'액세서리',i:'牛仔ACC',k:'데님ACC'},
  YP:{c:'상의',i:'牛仔衬衫',k:'데님셔츠'},YW:{c:'상의',i:'亚麻衬衫',k:'린넨셔츠'},
  YS:{c:'상의',i:'条纹衬衫',k:'스트라이프셔츠'},
};
const SEA={E:'SS',M:'SS',D:'SS',B:'FW',N:'FW',R:'RE',Q:'RE'};
const RATE=180;

// ═══ DATA LOAD ═══
let BD=null, CD=null, BP=[], CP=[];

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}

function loadData(){
  try{
    const bx=lsGet('bister_xl'); if(bx) BD=JSON.parse(bx);
    const cx=lsGet('qibao_xl');  if(cx) CD=JSON.parse(cx);
    const bp=lsGet('bister_pins'); if(bp) BP=JSON.parse(bp);
    const cp=lsGet('qibao_pins');  if(cp) CP=JSON.parse(cp);
  }catch(e){}

  const bDate=lsGet('bister_xl_date')||'—';
  const cDate=lsGet('qibao_xl_date')||'—';
  const st=document.getElementById('dataStatus');
  if(BD&&CD){
    st.textContent=`✓ BISTER(${bDate}) · QIBAO(${cDate}) 연동됨`;
    st.className='data-status ok';
  } else if(BD||CD){
    st.textContent=`⚠ ${BD?'BISTER':'QIBAO'} 데이터만 로드됨 — 나머지 도면 파일에서 엑셀 업로드 필요`;
    st.className='data-status';
  } else {
    st.textContent='⚠ 데이터 없음 — BISTER/QIBAO 도면에서 엑셀 업로드 후 재방문';
    st.className='data-status';
  }
}

// ═══ COLLECT STYLES ═══
function collectStyles(xd, pins){
  if(!xd||!xd.disp) return [];
  const map={};
  pins.forEach(pin=>{
    const items=xd.disp[pin.code]; if(!items) return;
    items.forEach(({bc,qty})=>{
      if(!bc||bc.length<10) return;
      const sn=bc.slice(0,10), sc=bc.slice(2,4), cc=bc.length>=12?bc.slice(10,12):'??';
      const s=SM[sc]||{c:'기타',i:'—',k:'—'};
      const sd=xd.sales[sn]||{qty:0,rev:0,price:0};
      if(!map[sn]) map[sn]={sn,cat:s.c,item:s.i,itemK:s.k||s.i,sc,dQty:0,sQty:sd.qty,rev:sd.rev,price:sd.price,pins:[],bcList:[]};
      map[sn].dQty+=qty;
      if(!map[sn].pins.includes(pin.code)) map[sn].pins.push(pin.code);
      if(!map[sn].bcList.includes(bc)) map[sn].bcList.push(bc);
    });
  });
  return Object.values(map);
}

function wan(v){return v>=10000?(v/10000).toFixed(1)+'万':v>0?v.toLocaleString()+'¥':'0¥';}
function krw(v){const w=Math.round(v*RATE);return w>=10000?(w/10000).toFixed(0)+'만원':w+'원';}
function pct(a,b){return b>0?Math.round(a/b*100):0;}

// ═══ TAB SWITCH (탭 1개) ═══

// ═══ ① 하의 비교 분석 ═══
function renderBtm(){
  const el=document.getElementById('btm-content');
  if(!BD&&!CD){el.innerHTML=emptyHtml('도면 파일에서 엑셀을 먼저 업로드해주세요','BISTER/QIBAO 도면 → 엑셀 업로드 후 이 페이지를 새로고침');return;}

  const bAll=BD?collectStyles(BD,BP):[];
  const cAll=CD?collectStyles(CD,CP):[];

  // 여성 하의만
  const bBtm=bAll.filter(s=>s.cat==='하의'&&s.sn[9]!=='G');
  const cBtm=cAll.filter(s=>s.cat==='하의'&&s.sn[9]!=='G');

  const bTotalRev=bAll.reduce((a,v)=>a+v.rev,0);
  const cTotalRev=cAll.reduce((a,v)=>a+v.rev,0);
  const bRev=bBtm.reduce((a,v)=>a+v.rev,0);
  const cRev=cBtm.reduce((a,v)=>a+v.rev,0);
  const bDqty=bBtm.reduce((a,v)=>a+v.dQty,0);
  const cDqty=cBtm.reduce((a,v)=>a+v.dQty,0);
  const bSqty=bBtm.reduce((a,v)=>a+v.sQty,0);
  const cSqty=cBtm.reduce((a,v)=>a+v.sQty,0);
  const bTurn=bDqty>0?(bSqty/bDqty).toFixed(2):'-';
  const cTurn=cDqty>0?(cSqty/cDqty).toFixed(2):'-';
  const bSkuCnt=new Set(bBtm.flatMap(s=>s.bcList)).size;
  const cSkuCnt=new Set(cBtm.flatMap(s=>s.bcList)).size;
  const bShare=pct(bRev,bTotalRev);
  const cShare=pct(cRev,cTotalRev);

  // ── 다중 집기 노출 효과 ──
  function multiEffect(btm){
    const single=btm.filter(s=>s.pins.length===1);
    const multi=btm.filter(s=>s.pins.length>=2);
    const sAvg=single.length>0?single.reduce((a,v)=>a+v.rev,0)/single.length:0;
    const mAvg=multi.length>0?multi.reduce((a,v)=>a+v.rev,0)/multi.length:0;
    const mult=sAvg>0?(mAvg/sAvg).toFixed(1):'-';
    return{single:single.length,multi:multi.length,sAvg,mAvg,mult};
  }
  const bME=multiEffect(bBtm), cME=multiEffect(cBtm);

  // ── 집기 타입별 하의 매출 ──
  function typeBreakdown(btm, pins){
    const m={face:{rev:0,cnt:0,dQty:0},hang:{rev:0,cnt:0,dQty:0},tbl:{rev:0,cnt:0,dQty:0},mnn:{rev:0,cnt:0,dQty:0}};
    const pinTypeMap={};
    pins.forEach(p=>{pinTypeMap[p.code]=p.type;});
    btm.forEach(s=>{
      const seen=new Set();
      s.pins.forEach(pc=>{
        const t=pinTypeMap[pc]||'face';
        if(!seen.has(t)){seen.add(t);if(m[t]){m[t].rev+=s.rev;m[t].cnt++;}}
      });
      s.pins.forEach(pc=>{const t=pinTypeMap[pc]||'face';if(m[t])m[t].dQty+=s.dQty/s.pins.length;});
    });
    return m;
  }
  const bTD=typeBreakdown(bBtm,BP), cTD=typeBreakdown(cBtm,CP);
  const typeLabel={face:'FACE',hang:'HANGER',tbl:'TABLE',mnn:'MQ(마네킹)'};
  const typeCol={face:'#e07b2a',hang:'#8b5cf6',tbl:'#10b981',mnn:'#3b82f6'};

  // ── TOP3 집중도 ──
  function top3Conc(btm){
    const sorted=btm.filter(s=>s.rev>0).sort((a,b)=>b.rev-a.rev);
    const top3=sorted.slice(0,3).reduce((a,v)=>a+v.rev,0);
    const total=btm.reduce((a,v)=>a+v.rev,0);
    return{pct:total>0?Math.round(top3/total*100):0, top3Rev:top3, topStyle:sorted[0]||null};
  }
  const bT3=top3Conc(bBtm), cT3=top3Conc(cBtm);

  // ── 마네킹 하의 착장 비중 ──
  function mnnBtmRatio(btm, pins){
    const mnnPins=pins.filter(p=>p.type==='mnn').map(p=>p.code);
    const mnnBtm=btm.filter(s=>s.pins.some(pc=>mnnPins.includes(pc)));
    return{cnt:mnnBtm.length, rev:mnnBtm.reduce((a,v)=>a+v.rev,0), total:btm.length};
  }
  const bMR=mnnBtmRatio(bBtm,BP), cMR=mnnBtmRatio(cBtm,CP);

  // ── 미판매 비율 ──
  const bZero=bBtm.filter(s=>s.sQty===0);
  const cZero=cBtm.filter(s=>s.sQty===0);

  // ── BP 판정: 비스터가 치바오보다 우위인 VMD 항목 ──
  // ── BP 상세 데이터 미리 계산 ──
  // 회전율: 상위/하위 스타일 목록

              <td style="font-weight:700;color:var(--B)">${wan(s.rev)}</td>
              <td style="color:${parseFloat(turn)>=0.3?'var(--ok)':'var(--danger)'}">${turn}회</td></tr>`;
          }).join('')}</tbody></table>`:'<div style="color:var(--mu2);font-size:11px;padding:12px 0">데이터 없음</div>'}
      </div>
      <div class="card">
        <div style="font-size:11px;font-weight:700;color:var(--C);margin-bottom:14px">🏬 QIBAO TOP 5</div>
        ${cTop.length?`<table class="item-tbl">
          <thead><tr><th>#</th><th>스타일번호</th><th>품목</th><th>시즌</th><th>진열</th><th>판매</th><th>매출</th><th>회전</th></tr></thead>
          <tbody>${cTop.map((s,i)=>{
            const rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
            const turn=s.dQty>0?(s.sQty/s.dQty).toFixed(2):'-';
            return `<tr><td><span class="rb ${rc}">${i+1}</span></td>
              <td style="font-weight:700;font-size:10px">${s.sn}</td><td>${s.itemK||s.item}</td>
              <td style="font-size:10px;color:var(--mu)">${SEA[s.sn[7]]||s.sn[7]}</td>
              <td style="text-align:center">${s.dQty}</td>
              <td style="text-align:center;color:var(--ok);font-weight:700">${s.sQty}</td>
              <td style="font-weight:700;color:var(--C)">${wan(s.rev)}</td>
              <td style="color:${parseFloat(turn)>=0.3?'var(--ok)':'var(--danger)'}">${turn}회</td></tr>`;
          }).join('')}</tbody></table>`:'<div style="color:var(--mu2);font-size:11px;padding:12px 0">데이터 없음</div>'}
      </div>
    </div>
  </div>

  <!-- ⑤-1 SKU 최적화 진단 -->
  <div class="section">
    <div class="sec-title">📋 하의 SKU 최적화 진단</div>
    <div class="two-col">
      ${[['B',bBtm,'var(--B)','BISTER'],['C',cBtm,'var(--C)','QIBAO']].map(([id,btm,col,name])=>{
        if(!btm.length) return `<div class="card"><div style="color:var(--mu2);font-size:11px;padding:20px 0;text-align:center">데이터 없음</div></div>`;

        const totalRev2=btm.reduce((a,v)=>a+v.rev,0);
        const soldStyles=btm.filter(s=>s.sQty>0&&s.dQty>0);
        const avgTurn=soldStyles.length>0?soldStyles.reduce((a,s)=>a+(s.sQty/s.dQty),0)/soldStyles.length:0;
        const avgRev=totalRev2/Math.max(btm.length,1);

        // Dead: 미판매
        const dead=btm.filter(s=>s.sQty===0);
        // 저회전: 판매 있지만 평균 대비 25% 미만
        const lowTurn=soldStyles.filter(s=>s.sQty/s.dQty<avgTurn*0.25).sort((a,b)=>(a.sQty/a.dQty)-(b.sQty/b.dQty));
        // 소량 단독 진열: 1집기 + 진열≤3 + 미판매 → 노출 부족 판단 불가
        const lonely=btm.filter(s=>s.pins.length===1&&s.dQty<=3&&s.sQty===0);
        // 품목 과다: 동일 품목 스타일 수
        const itemCnt={};
        btm.forEach(s=>{const k=s.itemK||s.item;if(!itemCnt[k])itemCnt[k]={cnt:0,soldCnt:0,revSum:0,dSum:0,sSum:0};itemCnt[k].cnt++;if(s.sQty>0)itemCnt[k].soldCnt++;itemCnt[k].revSum+=s.rev;itemCnt[k].dSum+=s.dQty;itemCnt[k].sSum+=s.sQty;});
        const overItems=Object.entries(itemCnt).filter(([,v])=>v.cnt>=2).sort((a,b)=>b[1].revSum-a[1].revSum);

        // 정리 총 추천
        const trimTarget=new Set([...dead.map(s=>s.sn),...lowTurn.map(s=>s.sn)]);

        return `<div class="card">
          <div style="font-size:11px;font-weight:700;color:${col};margin-bottom:16px">${name} — 총 ${btm.length}종 중 <span style="color:var(--danger)">${trimTarget.size}종 정리 검토</span></div>

          <!-- 정리 유형별 요약 -->
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
            <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;text-align:center">
              <div style="font-size:18px;font-weight:800;color:var(--danger)">${dead.length}</div>
              <div style="font-size:10px;color:#dc2626;margin-top:2px">❌ Dead (미판매)</div>
              <div style="font-size:9px;color:var(--mu);margin-top:2px">즉시 교체 대상</div>
            </div>
            <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:10px;text-align:center">
              <div style="font-size:18px;font-weight:800;color:var(--warn)">${lowTurn.length}</div>
              <div style="font-size:10px;color:#d97706;margin-top:2px">⚠️ 저회전</div>
              <div style="font-size:9px;color:var(--mu);margin-top:2px">평균의 25% 미만</div>
            </div>
            <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:10px;text-align:center">
              <div style="font-size:18px;font-weight:800;color:var(--ok)">${btm.length-trimTarget.size}</div>
              <div style="font-size:10px;color:#16a34a;margin-top:2px">✅ 유지</div>
              <div style="font-size:9px;color:var(--mu);margin-top:2px">정상 운영 스타일</div>
            </div>
          </div>

          <!-- Dead 목록 -->
          ${dead.length>0?`<div style="margin-bottom:12px">
            <div style="font-size:10px;font-weight:700;color:var(--danger);margin-bottom:6px">❌ 즉시 교체 — ${dead.length}종</div>
            ${dead.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f4f4f5;font-size:11px">
              <span style="font-weight:700;color:var(--mu)">${s.sn}</span>
              <span>${s.itemK||s.item}</span>
              <span style="color:var(--mu);font-size:10px">진열 ${s.dQty}장</span>
              <span style="font-size:9px;background:#fef2f2;color:var(--danger);padding:2px 6px;border-radius:3px;border:1px solid #fecaca">교체</span>
            </div>`).join('')}
          </div>`:''}

          <!-- 저회전 목록 -->
          ${lowTurn.length>0?`<div style="margin-bottom:12px">
            <div style="font-size:10px;font-weight:700;color:var(--warn);margin-bottom:6px">⚠️ 저회전 검토 — ${lowTurn.length}종 (평균 ${avgTurn.toFixed(2)}회의 25% 미만)</div>
            ${lowTurn.slice(0,5).map(s=>{const t=(s.sQty/s.dQty).toFixed(2);return`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f4f4f5;font-size:11px">
              <span style="font-weight:700;color:var(--mu)">${s.sn}</span>
              <span>${s.itemK||s.item}</span>
              <span style="color:var(--warn)">${t}회</span>
              <span style="font-size:9px;background:#fffbeb;color:#d97706;padding:2px 6px;border-radius:3px;border:1px solid #fde68a">검토</span>
            </div>`;}).join('')}
          </div>`:''}

          <!-- 품목별 파레토 분석 -->
          ${overItems.length>0?`<div>
            <div style="font-size:10px;font-weight:700;color:var(--mu);margin-bottom:8px">📦 품목별 파레토 — 매출 80% 담당 스타일 수 분석</div>
            ${overItems.map(([item,v])=>{
              const itemStyles=btm.filter(s=>(s.itemK||s.item)===item).sort((a,b)=>b.rev-a.rev);
              const totalItemRev=itemStyles.reduce((a,s)=>a+s.rev,0);
              let cum=0,top80cnt=0;
              for(const s of itemStyles){cum+=s.rev;top80cnt++;if(totalItemRev>0&&cum/totalItemRev>=0.8)break;}
              const deadCnt=itemStyles.filter(s=>s.sQty===0).length;
              const wastedCnt=itemStyles.length-top80cnt;
              const wastedRev=itemStyles.slice(top80cnt).reduce((a,s)=>a+s.rev,0);
              const wastedPct=totalItemRev>0?Math.round(wastedRev/totalItemRev*100):0;
              const badgeCol=wastedCnt>=3?'var(--danger)':wastedCnt>=1?'var(--warn)':'var(--ok)';
              const badgeTxt=wastedCnt>=3?'정리 필요':wastedCnt>=1?'검토':'양호';
              const badgeBg=wastedCnt>=3?'#fef2f2':wastedCnt>=1?'#fffbeb':'#f0fdf4';
              const badgeBdr=wastedCnt>=3?'#fecaca':wastedCnt>=1?'#fde68a':'#86efac';
              return`<div style="padding:8px 0;border-bottom:1px solid #f4f4f5">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;flex-wrap:wrap;cursor:pointer" onclick="togglePareto(this)">
                  <span style="width:60px;font-weight:700">${item}</span>
                  <span style="color:var(--mu)">총 ${itemStyles.length}종</span>
                  <span style="color:${col};font-weight:700">▶ 상위 ${top80cnt}종이 매출 80% 담당</span>
                  ${wastedCnt>0?`<span style="color:${badgeCol}">/ 하위 ${wastedCnt}종은 ${wastedPct}% 기여${deadCnt>0?' (미판매 '+deadCnt+'종 포함)':''}</span>`:''}
                  <span style="margin-left:auto;font-size:9px;padding:2px 7px;border-radius:3px;background:${badgeBg};color:${badgeCol};border:1px solid ${badgeBdr}">${badgeTxt}</span>
                </div>
                <div class="pareto-bar" style="display:flex;height:10px;border-radius:4px;overflow:hidden;gap:1px;cursor:pointer" onclick="togglePareto(this)">
                  ${itemStyles.map((s,i)=>{
                    const w=totalItemRev>0?Math.max(s.rev/totalItemRev*100,2):100/itemStyles.length;
                    const bg=s.sQty===0?'#e4e4e7':i<top80cnt?col:'#fbbf24';
                    return`<div title="${s.sn} ${s.itemK||s.item} ${s.sQty>0?s.rev+'¥':'미판매'}" style="height:10px;width:${w}%;background:${bg};min-width:4px"></div>`;
                  }).join('')}
                </div>
                <div style="display:flex;gap:12px;margin-top:4px;font-size:9px;color:var(--mu);align-items:center">
                  <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;background:${col};border-radius:1px;display:inline-block"></span>매출 기여 상위</span>
                  ${wastedCnt>0?`<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;background:#fbbf24;border-radius:1px;display:inline-block"></span>기여도 낮음 (${wastedCnt}종)</span>`:''}
                  ${deadCnt>0?`<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;background:#e4e4e7;border-radius:1px;display:inline-block"></span>미판매 ${deadCnt}종</span>`:''}
                  <span style="margin-left:auto;color:var(--mu);cursor:pointer" onclick="togglePareto(this.closest('[data-pareto]').querySelector('.pareto-bar'))">▼ 상세 보기</span>
                </div>
                <div class="pareto-detail" style="display:none;margin-top:10px;border:1px solid var(--bdr);border-radius:6px;overflow:hidden">
                  <table style="width:100%;border-collapse:collapse;font-size:11px">
                    <thead><tr style="background:#fafafa;border-bottom:2px solid var(--bdr)">
                      <th style="padding:6px 10px;text-align:left;font-size:10px;color:var(--mu);font-weight:600">#</th>
                      <th style="padding:6px 10px;text-align:left;font-size:10px;color:var(--mu);font-weight:600">스타일번호</th>
                      <th style="padding:6px 10px;font-size:10px;color:var(--mu);font-weight:600">시즌</th>
                      <th style="padding:6px 10px;text-align:center;font-size:10px;color:var(--mu);font-weight:600">진열</th>
                      <th style="padding:6px 10px;text-align:center;font-size:10px;color:var(--mu);font-weight:600">판매</th>
                      <th style="padding:6px 10px;text-align:right;font-size:10px;color:var(--mu);font-weight:600">매출(¥)</th>
                      <th style="padding:6px 10px;text-align:center;font-size:10px;color:var(--mu);font-weight:600">회전율</th>
                      <th style="padding:6px 10px;text-align:center;font-size:10px;color:var(--mu);font-weight:600">비중</th>
                      <th style="padding:6px 10px;text-align:center;font-size:10px;color:var(--mu);font-weight:600">판정</th>
                    </tr></thead>
                    <tbody>
                    ${itemStyles.map((s,i)=>{
                      const isTop=i<top80cnt;
                      const isDead=s.sQty===0;
                      const turn=s.dQty>0?(s.sQty/s.dQty).toFixed(2):'-';
                      const revPct=totalItemRev>0?Math.round(s.rev/totalItemRev*100):0;
                      const sea=SEA[s.sn[7]]||s.sn[7];
                      const rowBg=isDead?'#fff8f8':!isTop&&!isDead?'#fffdf0':'';
                      const judgment=isDead
                        ?'<span style="font-size:9px;padding:2px 6px;border-radius:3px;background:#fef2f2;color:var(--danger);border:1px solid #fecaca">❌ 교체</span>'
                        :isTop
                        ?'<span style="font-size:9px;padding:2px 6px;border-radius:3px;background:#f0fdf4;color:var(--ok);border:1px solid #86efac">✅ 유지</span>'
                        :'<span style="font-size:9px;padding:2px 6px;border-radius:3px;background:#fffbeb;color:var(--warn);border:1px solid #fde68a">⚠️ 검토</span>';
                      return`<tr style="background:${rowBg};border-bottom:1px solid #f4f4f5">
                        <td style="padding:6px 10px;color:var(--mu)">${i+1}</td>
                        <td style="padding:6px 10px;font-weight:700;font-size:10px">${s.sn}</td>
                        <td style="padding:6px 10px;font-size:10px;color:var(--mu)">${sea}</td>
                        <td style="padding:6px 10px;text-align:center">${s.dQty}</td>
                        <td style="padding:6px 10px;text-align:center;font-weight:700;color:${isDead?'var(--danger)':'var(--ok)'}">${isDead?'0':s.sQty}</td>
                        <td style="padding:6px 10px;text-align:right;font-weight:700;color:${isTop?col:'var(--mu)'}">${s.rev>0?s.rev.toLocaleString()+'¥':'—'}</td>
                        <td style="padding:6px 10px;text-align:center;color:${parseFloat(turn)>=0.3?'var(--ok)':'var(--danger)'}">${turn}회</td>
                        <td style="padding:6px 10px;text-align:center">
                          <div style="display:flex;align-items:center;gap:4px">
                            <div style="width:40px;height:4px;background:#e4e4e7;border-radius:2px"><div style="height:4px;width:${Math.min(revPct*2,100)}%;background:${isTop?col:'#fbbf24'};border-radius:2px"></div></div>
                            <span style="font-size:10px;color:var(--mu)">${revPct}%</span>
                          </div>
                        </td>
                        <td style="padding:6px 10px;text-align:center">${judgment}</td>
                      </tr>`;
                    }).join('')}
                    </tbody>
                  </table>
                </div>
              </div>`;
            }).join('')}
          </div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>

  <!-- ⑥ 미판매 Dead 재고 -->
  <div class="section">
    <div class="sec-title">미판매 하의 재고 비교</div>
    <div class="two-col">
      ${[['B',bZero,'var(--B)','BISTER'],['C',cZero,'var(--C)','QIBAO']].map(([id,zero,col,name])=>`
        <div class="card">
          <div style="font-size:11px;font-weight:700;color:${col};margin-bottom:14px">${name} 미판매 하의 — ${zero.length}종</div>
          ${zero.length?`<table class="item-tbl">
            <thead><tr><th>#</th><th>스타일번호</th><th>품목</th><th>시즌</th><th>진열수량</th><th>기회손실(¥)</th></tr></thead>
            <tbody>${zero.sort((a,b)=>b.dQty-a.dQty).slice(0,8).map((s,i)=>{
              const loss=(s.price||0)*s.dQty;
              return `<tr><td>${i+1}</td>
                <td style="font-weight:700;font-size:10px">${s.sn}</td>
                <td>${s.itemK||s.item}</td>
                <td style="font-size:10px;color:var(--mu)">${SEA[s.sn[7]]||s.sn[7]}</td>
                <td style="text-align:center;color:var(--danger);font-weight:700">${s.dQty}장</td>
                <td style="color:var(--danger)">${loss>0?wan(loss):'—'}</td></tr>`;
            }).join('')}</tbody></table>`
          :'<div style="color:var(--ok);font-size:12px;padding:12px 0">✓ 미판매 없음</div>'}
        </div>`).join('')}
    </div>
  </div>`;

  el.innerHTML=html;
}




// ═══ UTIL ═══
function emptyHtml(title,sub){
  return `<div class="empty"><div class="empty-icon">📡</div><div style="font-size:14px;font-weight:700;margin-bottom:8px">${title}</div><div class="empty-txt">${sub}</div></div>`;
}


function togglePareto(barEl){
  const container=barEl.closest('[style*="padding:8px 0"]')||barEl.parentElement.parentElement;
  const detail=container.querySelector('.pareto-detail');
  if(detail){detail.style.display=detail.style.display==='none'?'block':'none';}
}

let _activeBpIdx=null;
function showBpDetail(idx){
  if(_activeBpIdx===idx){closeBpDetail();return;}
  _activeBpIdx=idx;
  document.getElementById('bp-detail-panel').style.display='block';
  document.querySelectorAll('[id^="bp-det-"]').forEach(el=>el.style.display='none');
  document.getElementById('bp-det-'+idx).style.display='block';
  document.querySelectorAll('[id^="bp-arr-"]').forEach(el=>el.textContent='▼ 상세보기');
  document.getElementById('bp-arr-'+idx).textContent='▲ 닫기';
  document.getElementById('bp-detail-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closeBpDetail(){
  _activeBpIdx=null;
  document.getElementById('bp-detail-panel').style.display='none';
  document.querySelectorAll('[id^="bp-arr-"]').forEach(el=>el.textContent='▼ 상세보기');
}
// ═══ INIT ═══
loadData();
renderBtm();
</script>
</body>
</html>
